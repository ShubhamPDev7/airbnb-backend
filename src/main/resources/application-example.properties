spring.application.name=airBnbApp

# DB Config
spring.datasource.url=jdbc:postgresql://localhost:5432/your_db
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.servlet.context-path=/api/v1

# JWT
jwt.secretKey=your_long_random_secret_key_here

# Stripe — key names must match exactly (dotted, not camelCase)
stripe.secret.key=sk_test_your_key
stripe.webhook.secret=whsec_your_webhook_secret

# Frontend URL — used for CORS and password-reset email links
# Local dev:   http://localhost:5173
# Production:  https://your-app.vercel.app
frontend.url=http://localhost:5173

# Cookie security
# Set to false for local dev (HTTP), true for production (HTTPS required for Secure cookies)
app.cookie.secure=false

# Mail Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
app.google.client-id=YOUR_GOOGLE_CLIENT_ID_HERE
