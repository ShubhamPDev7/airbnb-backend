spring.application.name=airBnbApp

# DB Config (Variables will be injected by Railway)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.servlet.context-path=/api/v1

# Security Secrets
jwt.secretKey=${JWT_SECRET}
stripe.secret.key=${STRIPE_SECRET}
stripe.webhook.secret=${STRIPE_WEBHOOK}

# Web & CORS Config
frontend.url=${FRONTEND_URL}
app.cookie.secure=${COOKIE_SECURE}

# Mail Config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2
app.google.client-id=${GOOGLE_CLIENT_ID}

resend.api.key=${RESEND_API_KEY}